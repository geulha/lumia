<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${artigo.titulo} + ' - Base de Conhecimento')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="lumia-main-content">
        <div style="max-width: 820px; margin: 0 auto;">
            <a th:href="@{/artigos}" style="text-decoration: none; color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 15px;">
                <i class="bi bi-arrow-left"></i> Voltar à Base de Conhecimento
            </a>

            <div style="background: white; border-radius: 24px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #EDF2F7;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span class="status-tag" style="background-color: #EAF3DF; color: #33691E; font-size: 13px;" th:text="${artigo.categoria}">Férias</span>
                    <span style="font-size: 13px; font-weight: 700; color: var(--primary-purple);" th:text="${artigo.codigoFormatado}">ART0183</span>
                </div>

                <h1 style="font-size: 26px; font-weight: 800; color: var(--primary-dark); margin-bottom: 14px; letter-spacing: -0.5px;" th:text="${artigo.titulo}">
                    Orientações sobre Agendamento de Férias
                </h1>

                <div style="display: flex; align-items: center; gap: 15px; color: var(--text-muted); font-size: 12px; margin-bottom: 30px; border-bottom: 1px solid #EDF2F7; padding-bottom: 16px;">
                    <span><i class="bi bi-person"></i> Publicado por: <strong th:text="${artigo.autor.nome}">Zosia Hivemind</strong></span>
                    <span>•</span>
                    <span><i class="bi bi-calendar3"></i> Em: <span th:text="${artigo.dataFormatada}">11/06/2026</span></span>
                    <span>•</span>
                    <span th:text="${artigo.tempoRelativo}">três horas atrás</span>
                </div>

                <!-- Conteúdo do Artigo -->
                <div style="font-size: 15px; color: #2D3748; line-height: 1.8; white-space: pre-wrap; margin-bottom: 35px;" th:text="${artigo.conteudo}">
                    Texto completo do artigo...
                </div>

                <div style="border-top: 1px solid #EDF2F7; padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <a th:href="@{/artigos}" class="btn-secondary">
                        <i class="bi bi-arrow-left"></i> Ver Outros Artigos
                    </a>
                    <a th:if="${usuarioLogado != null and usuarioLogado.isColaborador()}" th:href="@{/colaborador/formularios}" class="btn-primary">
                        <i class="bi bi-plus-circle"></i> Abrir Solicitação Relacionada
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
