<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ocorreu um Erro')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="lumia-main-content">
        <div style="background: white; border-radius: 24px; padding: 60px 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.04); max-width: 650px; margin: 40px auto;">
            <div style="font-size: 64px; color: #F57C00; margin-bottom: 20px;">
                <i class="bi bi-exclamation-diamond-fill"></i>
            </div>
            <h2 style="font-size: 26px; font-weight: 700; color: var(--primary-dark); margin-bottom: 12px;">Ops! Algo deu errado</h2>
            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 28px; line-height: 1.6;" th:text="${mensagem != null ? mensagem : 'A solicitação não pôde ser completada no momento. Por favor, tente novamente mais tarde.'}">
                A solicitação não pôde ser completada no momento.
            </p>
            <div style="display: flex; justify-content: center; gap: 16px;">
                <a th:href="@{/}" class="btn-primary">
                    <i class="bi bi-arrow-left"></i> Retornar ao Início
                </a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
