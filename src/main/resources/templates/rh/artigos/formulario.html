<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdicao} ? 'Editar Artigo' : 'Novo Artigo')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="lumia-main-content">
        <div style="max-width: 800px; margin: 0 auto;">
            <a th:href="@{/rh/gerenciar/base-conhecimento}" style="text-decoration: none; color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;">
                <i class="bi bi-arrow-left"></i> Voltar à Lista de Artigos
            </a>

            <div style="background: white; border-radius: 24px; padding: 35px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #EDF2F7;">
                <h2 class="section-title" style="font-size: 22px; margin-bottom: 6px;" th:text="${isEdicao} ? 'Editar Artigo: ' + ${artigoTitulo} : 'Criar Novo Artigo para a Base de Conhecimento'">
                    Criar Novo Artigo
                </h2>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">
                    Compartilhe orientações claras para que os colaboradores tirem dúvidas sem necessidade de abrir chamados repetitivos.
                </p>

                <form th:action="${isEdicao} ? @{/rh/gerenciar/base-conhecimento/{id}/editar(id=${artigoForm.id})} : @{/rh/gerenciar/base-conhecimento/novo}"
                      th:object="${artigoForm}" method="post">

                    <input type="hidden" th:if="${isEdicao}" th:field="*{id}">

                    <div class="form-group">
                        <label for="titulo" class="form-label">Título do Artigo / FAQ *</label>
                        <input type="text" id="titulo" th:field="*{titulo}" class="form-control" placeholder="Ex.: Orientações sobre Agendamento de Férias" required>
                        <div th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="categoria" class="form-label">Categoria do Artigo *</label>
                            <input list="listaCategorias" id="categoria" th:field="*{categoria}" class="form-control" placeholder="Ex.: Férias, Folha de Pagamento, Benefícios..." required>
                            <datalist id="listaCategorias">
                                <option th:each="cat : ${categorias}" th:value="${cat}"></option>
                            </datalist>
                            <div th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="visivelParaPerfil" class="form-label">Visibilidade por Perfil</label>
                            <select id="visivelParaPerfil" th:field="*{visivelParaPerfil}" class="form-control">
                                <option value="">Todos os perfis</option>
                                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="visivelParaPosto" class="form-label">Restrição por Cargo / Posto (Opcional)</label>
                        <input type="text" id="visivelParaPosto" th:field="*{visivelParaPosto}" class="form-control" placeholder="Deixe em branco para permitir todos os cargos">
                    </div>

                    <!-- Escolha do Ícone -->
                    <div class="form-group">
                        <label class="form-label">Ícone de Identificação do Artigo (Selecione um)</label>

                        <style>
                            .icon-choice-grid {
                                display: flex;
                                flex-wrap: wrap;
                                gap: 12px;
                                margin-top: 8px;
                            }
                            .icon-radio-label {
                                cursor: pointer;
                                margin: 0;
                                user-select: none;
                                position: relative;
                            }
                            .icon-radio-label input[type="radio"] {
                                position: absolute;
                                opacity: 0;
                                width: 0;
                                height: 0;
                                margin: 0;
                            }
                            .icon-radio-label .icon-tile {
                                width: 52px;
                                height: 52px;
                                border-radius: 12px;
                                border: 2px solid #E2E8F0;
                                background: #FFFFFF;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: 24px;
                                color: #64748B;
                                transition: all 0.15s ease-in-out;
                            }
                            .icon-radio-label:hover .icon-tile {
                                border-color: #CBD5E1;
                                color: var(--primary-purple);
                                transform: translateY(-2px);
                            }
                            .icon-radio-label input[type="radio"]:checked + .icon-tile {
                                border-color: var(--primary-purple);
                                background: #F3E8FF;
                                color: var(--primary-purple);
                                box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.25);
                                transform: scale(1.05);
                            }
                        </style>

                        <div class="icon-choice-grid">
                            <!-- 1. Documento / Geral -->
                            <label class="icon-radio-label" title="Documento / Geral">
                                <input type="radio" th:field="*{icone}" value="bi-file-earmark-text">
                                <div class="icon-tile">
                                    <i class="bi bi-file-earmark-text"></i>
                                </div>
                            </label>

                            <!-- 2. Pagamento / Benefício -->
                            <label class="icon-radio-label" title="Pagamento / Folha">
                                <input type="radio" th:field="*{icone}" value="bi-cash-coin">
                                <div class="icon-tile">
                                    <i class="bi bi-cash-coin"></i>
                                </div>
                            </label>

                            <!-- 3. Férias / Calendário -->
                            <label class="icon-radio-label" title="Férias / Calendário">
                                <input type="radio" th:field="*{icone}" value="bi-calendar-check">
                                <div class="icon-tile">
                                    <i class="bi bi-calendar-check"></i>
                                </div>
                            </label>

                            <!-- 4. Saúde / Bem-estar -->
                            <label class="icon-radio-label" title="Saúde / Bem-estar">
                                <input type="radio" th:field="*{icone}" value="bi-heart-pulse">
                                <div class="icon-tile">
                                    <i class="bi bi-heart-pulse"></i>
                                </div>
                            </label>

                            <!-- 5. Dúvidas / FAQ -->
                            <label class="icon-radio-label" title="Dúvidas / FAQ">
                                <input type="radio" th:field="*{icone}" value="bi-question-circle">
                                <div class="icon-tile">
                                    <i class="bi bi-question-circle"></i>
                                </div>
                            </label>

                            <!-- 6. Importante / Alerta -->
                            <label class="icon-radio-label" title="Importante / Atenção">
                                <input type="radio" th:field="*{icone}" value="bi-exclamation-octagon">
                                <div class="icon-tile">
                                    <i class="bi bi-exclamation-octagon"></i>
                                </div>
                            </label>

                            <!-- 7. Relógio / Prazos / Horários -->
                            <label class="icon-radio-label" title="Relógio / Prazos / Ponto">
                                <input type="radio" th:field="*{icone}" value="bi-clock-history">
                                <div class="icon-tile">
                                    <i class="bi bi-clock-history"></i>
                                </div>
                            </label>

                            <!-- 8. Segurança / Privacidade -->
                            <label class="icon-radio-label" title="Segurança / Proteção">
                                <input type="radio" th:field="*{icone}" value="bi-shield-lock">
                                <div class="icon-tile">
                                    <i class="bi bi-shield-lock"></i>
                                </div>
                            </label>

                            <!-- 9. Trabalho / Carreira -->
                            <label class="icon-radio-label" title="Trabalho / Carreira">
                                <input type="radio" th:field="*{icone}" value="bi-briefcase">
                                <div class="icon-tile">
                                    <i class="bi bi-briefcase"></i>
                                </div>
                            </label>

                            <!-- 10. Informativo / Comunicado -->
                            <label class="icon-radio-label" title="Informativo / Comunicado">
                                <input type="radio" th:field="*{icone}" value="bi-info-circle">
                                <div class="icon-tile">
                                    <i class="bi bi-info-circle"></i>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="conteudo" class="form-label">Conteúdo Completo do Artigo / Política *</label>
                        <textarea id="conteudo" th:field="*{conteudo}" class="form-control" rows="8" placeholder="Escreva aqui todas as instruções, regras, prazos e orientações pertinentes..." required></textarea>
                        <div th:if="${#fields.hasErrors('conteudo')}" th:errors="*{conteudo}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="background: #F8FAFC; padding: 14px 18px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #EDF2F7;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" th:field="*{publicado}"> Artigo Publicado (visível para busca e consulta dos colaboradores)
                        </label>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        <a th:href="@{/rh/gerenciar/base-conhecimento}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="${isEdicao} ? 'Salvar Alterações' : 'Publicar Artigo'">Salvar</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
