<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdicao} ? 'Editar Artigo' : 'Novo Artigo')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="lumia-main-content">
        <div style="max-width: 800px; margin: 0 auto;">
            <a th:href="@{/rh/gerenciar/base-conhecimento}" style="text-decoration: none; color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;">
                <i class="bi bi-arrow-left"></i> Voltar à Lista de Artigos
            </a>

            <div style="background: white; border-radius: 24px; padding: 35px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #EDF2F7;">
                <h2 class="section-title" style="font-size: 22px; margin-bottom: 6px;" th:text="${isEdicao} ? 'Editar Artigo: ' + ${artigoTitulo} : 'Criar Novo Artigo para a Base de Conhecimento'">
                    Criar Novo Artigo
                </h2>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">
                    Compartilhe orientações claras para que os colaboradores tirem dúvidas sem necessidade de abrir chamados repetitivos.
                </p>

                <form th:action="${isEdicao} ? @{/rh/gerenciar/base-conhecimento/{id}/editar(id=${artigoForm.id})} : @{/rh/gerenciar/base-conhecimento/novo}"
                      th:object="${artigoForm}" method="post">

                    <input type="hidden" th:if="${isEdicao}" th:field="*{id}">

                    <div class="form-group">
                        <label for="titulo" class="form-label">Título do Artigo / FAQ *</label>
                        <input type="text" id="titulo" th:field="*{titulo}" class="form-control" placeholder="Ex.: Orientações sobre Agendamento de Férias" required>
                        <div th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="categoria" class="form-label">Categoria do Artigo *</label>
                            <input list="listaCategorias" id="categoria" th:field="*{categoria}" class="form-control" placeholder="Ex.: Férias, Folha de Pagamento, Benefícios..." required>
                            <datalist id="listaCategorias">
                                <option th:each="cat : ${categorias}" th:value="${cat}"></option>
                            </datalist>
                            <div th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="visivelParaPerfil" class="form-label">Visibilidade por Perfil</label>
                            <select id="visivelParaPerfil" th:field="*{visivelParaPerfil}" class="form-control">
                                <option value="">Todos os perfis</option>
                                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="visivelParaPosto" class="form-label">Restrição por Cargo / Posto (Opcional)</label>
                        <input type="text" id="visivelParaPosto" th:field="*{visivelParaPosto}" class="form-control" placeholder="Deixe em branco para permitir todos os cargos">
                    </div>

                    <!-- Escolha do Ícone -->
                    <div class="form-group">
                        <label class="form-label">Ícone de Identificação do Artigo</label>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-top: 6px;">
                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-file-earmark-text" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-file-earmark-text" style="font-size: 24px; color: var(--primary-purple);"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Geral / Doc</span>
                            </label>

                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-cash-coin" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-cash-coin" style="font-size: 24px; color: #16A34A;"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Pagamento</span>
                            </label>

                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-calendar-check" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-calendar-check" style="font-size: 24px; color: #2563EB;"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Férias / Ponto</span>
                            </label>

                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-heart-pulse" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-heart-pulse" style="font-size: 24px; color: #DC2626;"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Saúde / Benefício</span>
                            </label>

                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-question-circle" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-question-circle" style="font-size: 24px; color: #D97706;"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Dúvidas / FAQ</span>
                            </label>

                            <label style="border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 8px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary-purple)'" onmouseout="if(!this.querySelector('input').checked) this.style.borderColor='#E2E8F0'">
                                <input type="radio" th:field="*{icone}" value="bi-shield-check" style="display: none;" onchange="document.querySelectorAll('.icon-choice').forEach(el => el.style.borderColor='#E2E8F0'); this.closest('label').style.borderColor='var(--primary-purple)';">
                                <i class="bi bi-shield-check" style="font-size: 24px; color: #4F46E5;"></i>
                                <span style="font-size: 11px; font-weight: 600; color: #4A5568;">Normas / Jurídico</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="conteudo" class="form-label">Conteúdo Completo do Artigo / Política *</label>
                        <textarea id="conteudo" th:field="*{conteudo}" class="form-control" rows="8" placeholder="Escreva aqui todas as instruções, regras, prazos e orientações pertinentes..." required></textarea>
                        <div th:if="${#fields.hasErrors('conteudo')}" th:errors="*{conteudo}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="background: #F8FAFC; padding: 14px 18px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #EDF2F7;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" th:field="*{publicado}"> Artigo Publicado (visível para busca e consulta dos colaboradores)
                        </label>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        <a th:href="@{/rh/gerenciar/base-conhecimento}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="${isEdicao} ? 'Salvar Alterações' : 'Publicar Artigo'">Salvar</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
