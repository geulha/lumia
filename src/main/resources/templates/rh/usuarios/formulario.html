<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdicao} ? 'Editar Usuário' : 'Novo Usuário')}"></head>
<body>

    <header th:replace="~{fragments/layout :: header}"></header>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="lumia-main-content">
        <div style="max-width: 700px; margin: 0 auto;">
            <a th:href="@{/rh/gerenciar/usuarios}" style="text-decoration: none; color: var(--text-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;">
                <i class="bi bi-arrow-left"></i> Voltar para Lista de Usuários
            </a>

            <div style="background: white; border-radius: 24px; padding: 35px 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #EDF2F7;">
                <h2 class="section-title" style="font-size: 22px; margin-bottom: 6px;" th:text="${isEdicao} ? 'Editar Usuário: ' + ${usuarioNome} : 'Cadastrar Novo Usuário'">
                    Cadastrar Novo Usuário
                </h2>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;" th:text="${isEdicao} ? 'Atualize as informações cadastrais e hierárquicas deste usuário.' : 'Preencha os dados do colaborador. Uma senha aleatória temporária será gerada automaticamente ao salvar.'">
                    Preencha os dados do colaborador.
                </p>

                <form th:action="${isEdicao} ? @{/rh/gerenciar/usuarios/{id}/editar(id=${usuarioForm.id})} : @{/rh/gerenciar/usuarios/novo}"
                      th:object="${usuarioForm}" method="post">

                    <input type="hidden" th:if="${isEdicao}" th:field="*{id}">

                    <div class="form-group">
                        <label for="nome" class="form-label">Nome Completo *</label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control" placeholder="Ex.: Maria Souza" required>
                        <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="email" class="form-label">E-mail Corporativo *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="maria.souza@lumia.com.br" required>
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="cpf" class="form-label">CPF (Apenas números)</label>
                            <input type="text" id="cpf" th:field="*{cpf}" class="form-control" placeholder="000.000.000-00" maxlength="14">
                            <div th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="perfil" class="form-label">Perfil de Acesso *</label>
                            <select id="perfil" th:field="*{perfil}" class="form-control" required>
                                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                            </select>
                            <div th:if="${#fields.hasErrors('perfil')}" th:errors="*{perfil}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>

                        <div class="form-group">
                            <label for="posto" class="form-label">Cargo / Posto de Trabalho</label>
                            <input type="text" id="posto" th:field="*{posto}" class="form-control" placeholder="Ex.: Analista de Recursos Humanos">
                            <div th:if="${#fields.hasErrors('posto')}" th:errors="*{posto}" style="color: #D32F2F; font-size: 12px; margin-top: 4px;"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="gestorId" class="form-label">Gestor Imediato (Hierarquia para Aprovações)</label>
                        <select id="gestorId" th:field="*{gestorId}" class="form-control">
                            <option value="">-- Sem Gestor Imediato Vinculado --</option>
                            <option th:each="g : ${gestores}" th:value="${g.id}" th:text="${g.nome + ' (' + (g.posto != null ? g.posto : g.perfil.descricao) + ')'}"></option>
                        </select>
                        <small style="color: var(--text-muted); font-size: 12px; display: block; margin-top: 4px;">
                            Solicitações que exigem aprovação prévia serão direcionadas à aba "Minhas Aprovações" do gestor selecionado.
                        </small>
                    </div>

                    <div style="display: flex; gap: 24px; margin-top: 10px; margin-bottom: 25px; background: #F8FAFC; padding: 16px; border-radius: 12px;">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;">
                            <input type="checkbox" th:field="*{ativo}"> Conta Ativa no Sistema
                        </label>

                        <label th:if="${isEdicao}" style="display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; color: #D32F2F;">
                            <input type="checkbox" th:field="*{bloqueado}"> Acesso Bloqueado
                        </label>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        <a th:href="@{/rh/gerenciar/usuarios}" class="btn-secondary">Cancelar</a>
                        <button type="submit" class="btn-primary">
                            <i class="bi bi-check2-circle"></i>
                            <span th:text="${isEdicao} ? 'Salvar Alterações' : 'Cadastrar Usuário'">Cadastrar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
