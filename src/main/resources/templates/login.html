<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Lumia Portal do Colaborador</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F0F4FD 0%, #E2E8F0 100%);
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(30, 27, 122, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            text-align: center;
        }
        .login-brand-title {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 6px;
            letter-spacing: -1px;
        }
        .login-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            background: var(--primary-dark);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #14115A;
            box-shadow: 0 6px 18px rgba(30, 27, 122, 0.25);
        }
        .credentials-tip {
            margin-top: 25px;
            padding: 15px;
            background-color: #F8FAFC;
            border: 1px dashed #CBD5E0;
            border-radius: 14px;
            font-size: 12px;
            text-align: left;
            color: #4A5568;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand-title">Lumia</div>
        <p class="login-subtitle">Portal do Colaborador & Atendimento RH</p>

        <!-- Mensagens de Alerta -->
        <div th:if="${mensagemErro != null}" class="alert alert-danger" style="text-align: left; margin-bottom: 20px;">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${mensagemErro}">Credenciais inválidas.</span>
        </div>

        <div th:if="${mensagemSucesso != null}" class="alert alert-success" style="text-align: left; margin-bottom: 20px;">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${mensagemSucesso}">Logout realizado com sucesso.</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group" style="text-align: left;">
                <label for="email" class="form-label">E-mail corporativo</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="seu.email@lumia.com.br" required autofocus>
            </div>

            <div class="form-group" style="text-align: left; margin-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="senha" class="form-label" style="margin-bottom: 0;">Senha de acesso</label>
                    <a th:href="@{/recuperar-senha}" style="font-size: 12px; color: var(--primary-purple); text-decoration: none; font-weight: 500;">
                        Esqueci minha senha
                    </a>
                </div>
                <input type="password" id="senha" name="senha" class="form-control" style="margin-top: 6px;" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>
    </div>
</div>

</body>
</html>
