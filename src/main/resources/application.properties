spring.application.name=lumia-portal

# Servidor
server.port=${PORT:8080}
server.error.include-message=always

# Database (PostgreSQL padrão via docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lumia_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lumia_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lumia_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
lumia.upload.dir=./uploads
