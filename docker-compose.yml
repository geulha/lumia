services:
  postgres:
    image: postgres:16-alpine
    container_name: lumia-postgres
    restart: always
    environment:
      POSTGRES_DB: lumia_db
      POSTGRES_USER: lumia_user
      POSTGRES_PASSWORD: lumia_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumia_user -d lumia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
